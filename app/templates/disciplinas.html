<div class="container mt-5">
<h2>Tabela de Disciplinas</h2>

<table class="table">
<thead>
<tr>
<th>Nome</th>
<th>Área</th>
</tr>
</thead>
<tbody>
{% for disciplina in disciplinas %}
<tr>
<td>{{ disciplina.nome }}</td>
<td>{{ disciplina.area_saber }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
