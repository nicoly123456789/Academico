<div class="container mt-5">
<h2>Tabela de Frequência</h2>

<table class="table">
<thead>
<tr>
<th>Curso</th>
<th>Disciplina</th>
<th>Pessoa</th>
<th>Faltas</th>
</tr>
</thead>
<tbody>
{% for frequencia in frequencias %}
<tr>
<td>{{ frequencia.curso }}</td>
<td>{{ frequencia.disciplina }}</td>
<td>{{ frequencia.pessoa }}</td>
<td>{{ frequencia.numero_faltas }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
