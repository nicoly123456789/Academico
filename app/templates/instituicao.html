<div class="container mt-5">
<h2>Tabela de Instituições</h2>

<table class="table">
<thead>
<tr>
<th>Nome</th>
<th>Site</th>
<th>Telefone</th>
<th>Cidade</th>
</tr>
</thead>
<tbody>
{% for instituicao in instituicoes %}
<tr>
<td>{{ instituicao.nome }}</td>
<td>{{ instituicao.site }}</td>
<td>{{ instituicao.telefone }}</td>
<td>{{ instituicao.cidade }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
