<div class="container mt-5">
<h2>Tabela de Ocorrências</h2>

<table class="table">
<thead>
<tr>
<th>Descrição</th>
<th>Data</th>
<th>Curso</th>
<th>Disciplina</th>
<th>Pessoa</th>
</tr>
</thead>
<tbody>
{% for ocorrencia in ocorrencias %}
<tr>
<td>{{ ocorrencia.descricao }}</td>
<td>{{ ocorrencia.data }}</td>
<td>{{ ocorrencia.curso }}</td>
<td>{{ ocorrencia.disciplina }}</td>
<td>{{ ocorrencia.pessoa }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
